<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#0F1119;
    --bg-elevated:#161927;
    --surface:#1D2131;
    --surface-hover:#262B40;
    --border:#2B3046;
    --text:#ECEEF5;
    --text-dim:#8B8FA8;
    --text-faint:#565C77;
    --gold:#E8B454;
    --gold-dim:rgba(232,180,84,0.14);
    --teal:#52D6C6;
    --teal-dim:rgba(82,214,198,0.14);
    --danger:#E2604F;
    --danger-dim:rgba(226,96,79,0.14);
    --violet:#9088E8;
    --violet-dim:rgba(144,136,232,0.16);
    --now:#FF6B5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding:20px 16px 80px;min-height:100vh;}

  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}

  /* Header */
  .header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;}
  .header .brand{font-size:22px;font-weight:700;letter-spacing:0.02em;}
  .header .brand span{color:var(--gold);}
  .header .date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);text-transform:capitalize;}

  /* Nav switch */
  .nav-switch{display:flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:22px;gap:4px;}
  .nav-switch button{flex:1;border:none;background:transparent;color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:9px 0;border-radius:9px;cursor:pointer;transition:all .18s ease;}
  .nav-switch button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,0.03) inset;}
  .nav-switch button:not(.active):hover{color:var(--text);}
  .nav-switch button.active.tab-habits{background:var(--gold-dim);color:var(--gold);}
  .nav-switch button.active.tab-brain{background:var(--teal-dim);color:var(--teal);}
  .nav-switch button.active.tab-planning{background:var(--violet-dim);color:var(--violet);}

  /* HUD */
  .hud{background:linear-gradient(145deg,var(--bg-elevated),var(--surface));border:1px solid var(--border);border-radius:16px;padding:18px 18px 16px;margin-bottom:20px;position:relative;overflow:hidden;}
  .hud-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .hud-rank{display:flex;align-items:center;gap:10px;}
  .rank-badge{width:38px;height:38px;border-radius:10px;background:var(--gold-dim);border:1px solid rgba(232,180,84,0.35);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--gold);font-size:14px;flex-shrink:0;}
  .rank-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
  .rank-sub{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);margin-top:1px;}
  .hud-streak{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-dim);}
  .hud-streak b{color:var(--text);font-weight:600;}
  .xp-track{height:7px;border-radius:5px;background:var(--bg);overflow:hidden;position:relative;border:1px solid var(--border);}
  .xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),#F3CE84);border-radius:5px;transition:width .4s cubic-bezier(.4,0,.2,1);}
  .xp-label{display:flex;justify-content:space-between;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);}

  /* Habit grid */
  .section-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;margin:22px 0 10px;}
  .habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .habit-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 12px;position:relative;transition:border-color .15s ease,transform .1s ease;}
  .habit-card.done{border-color:rgba(232,180,84,0.5);background:linear-gradient(160deg,var(--gold-dim),var(--surface) 60%);}
  .habit-card:active{transform:scale(0.98);}
  .habit-emoji{font-size:22px;line-height:1;}
  .habit-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;margin-top:8px;line-height:1.25;}
  .habit-streak{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);margin-top:5px;display:flex;align-items:center;gap:3px;}
  .habit-streak.active{color:var(--gold);}
  .habit-check{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;transition:all .15s ease;}
  .habit-card.done .habit-check{background:var(--gold);border-color:var(--gold);color:var(--bg-elevated);}
  .habit-tools{display:flex;gap:6px;margin-top:10px;}
  .icon-btn{border:none;background:transparent;color:var(--text-faint);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:5px;}
  .icon-btn:hover{color:var(--text-dim);background:var(--surface-hover);}
  .icon-btn.danger-active{color:var(--danger);background:var(--danger-dim);}

  .add-card{border:1.5px dashed var(--border);background:transparent;border-radius:14px;padding:14px 12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-faint);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;min-height:90px;transition:border-color .15s ease,color .15s ease;}
  .add-card:hover{border-color:var(--text-faint);color:var(--text-dim);}

  .inline-form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;grid-column:span 2;}
  .inline-form .row{display:flex;gap:8px;margin-bottom:8px;}
  .inline-form input{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:8px 10px;outline:none;}
  .inline-form input:focus{border-color:var(--text-faint);}
  .inline-form input.emoji-in{width:52px;text-align:center;font-size:16px;padding:8px 6px;}
  .inline-form input.name-in{flex:1;min-width:0;}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;}
  .btn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;border:none;border-radius:8px;padding:7px 13px;cursor:pointer;}
  .btn-primary{background:var(--gold);color:#1a1305;}
  .btn-ghost{background:transparent;color:var(--text-faint);}
  .btn-ghost:hover{color:var(--text-dim);}

  /* Brain view */
  .pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-ms-overflow-style:none;scrollbar-width:none;flex-wrap:wrap;}
  .pill-row::-webkit-scrollbar{display:none;}
  .pill{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
  .pill.active{background:var(--teal-dim);border-color:rgba(82,214,198,0.5);color:var(--teal);}
  .pill.sub{font-size:12px;padding:6px 11px;}
  .pill.sub.active{background:var(--gold-dim);border-color:rgba(232,180,84,0.5);color:var(--gold);}
  .pill .x{opacity:0.5;font-size:11px;margin-left:2px;}
  .pill.confirming{background:var(--danger-dim);border-color:var(--danger);color:var(--danger);}
  .pill-add{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1.5px dashed var(--border);color:var(--text-faint);cursor:pointer;background:transparent;}
  .pill-add:hover{border-color:var(--text-faint);color:var(--text-dim);}

  .brain-empty{color:var(--text-faint);font-size:13px;text-align:center;padding:40px 20px;font-family:'JetBrains Mono',monospace;}

  .note-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .note-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);}
  .note-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;color:var(--text-dim);}
  .save-indicator{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--teal);opacity:0;transition:opacity .3s ease;}
  .save-indicator.show{opacity:1;}
  textarea.note-textarea{width:100%;min-height:280px;background:transparent;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.65;padding:16px 14px;resize:vertical;}
  textarea.note-textarea::placeholder{color:var(--text-faint);}

  .rename-in{background:var(--bg);border:1px solid var(--text-faint);border-radius:8px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:6px 9px;outline:none;width:110px;}

  .sync-note{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);margin-top:18px;opacity:0.7;}

  .coach-card{display:flex;align-items:flex-start;gap:10px;background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:18px;}
  .coach-icon{font-size:18px;line-height:1.3;flex-shrink:0;}
  .coach-text{font-size:13px;color:var(--text-dim);line-height:1.5;}
  .coach-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:3px;}

  /* Planning */
  .week-nav{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .week-nav .arrow{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px;flex-shrink:0;}
  .week-nav .arrow:hover{background:var(--surface-hover);}
  .week-nav .today-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:11px;padding:0 10px;height:32px;border-radius:9px;cursor:pointer;}
  .week-nav .today-btn:hover{color:var(--text);border-color:var(--text-faint);}
  .week-strip{display:flex;gap:6px;margin-bottom:16px;}
  .day-pill{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:8px 2px;cursor:pointer;transition:all .15s ease;}
  .day-pill .dow{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-faint);text-transform:uppercase;}
  .day-pill .dnum{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
  .day-pill.active{background:var(--violet-dim);border-color:rgba(144,136,232,0.55);}
  .day-pill.active .dow,.day-pill.active .dnum{color:var(--violet);}
  .day-pill.is-today .dnum::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--now);margin:2px auto 0;}

  .agenda-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .agenda-scroll{max-height:520px;overflow-y:auto;position:relative;}
  .agenda-grid{position:relative;padding:6px 10px 6px 54px;background-image:repeating-linear-gradient(to bottom, var(--border) 0, var(--border) 1px, transparent 1px, transparent 50px);background-position:0 3px;}
  .hour-label{position:absolute;left:0;width:44px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);transform:translateY(-6px);}
  .event-block{position:absolute;left:54px;right:10px;background:var(--violet-dim);border-left:3px solid var(--violet);border-radius:7px;padding:5px 8px;cursor:pointer;overflow:hidden;}
  .event-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .event-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);}
  .now-line{position:absolute;left:44px;right:10px;height:0;border-top:2px solid var(--now);z-index:3;}
  .now-line::before{content:'';position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--now);}

  .add-event-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-bottom:1px solid var(--border);color:var(--text-faint);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;}
  .add-event-bar:hover{color:var(--text-dim);background:var(--surface-hover);}
  .event-form{padding:14px;border-bottom:1px solid var(--border);}
  .event-form .row{display:flex;gap:8px;margin-bottom:8px;}
  .event-form input{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:8px 10px;outline:none;}
  .event-form input:focus{border-color:var(--text-faint);}
  .event-form input.time-in{width:96px;}
  .event-form input.emoji-in2{width:48px;text-align:center;font-size:15px;padding:8px 4px;}
  .event-form input.title-in{flex:1;min-width:0;}
  .event-form .form-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;}
  .event-form select.remind-select{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:12.5px;padding:8px 10px;outline:none;flex:1;}
  .event-form textarea.desc-textarea{width:100%;min-height:52px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:12.5px;padding:8px 10px;outline:none;resize:vertical;}
  .event-form textarea.desc-textarea:focus{border-color:var(--text-faint);}
  .notif-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--violet-dim);border:1px solid rgba(144,136,232,0.4);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;color:var(--text-dim);}
  .notif-banner button{background:var(--violet);color:#151233;border:none;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .gcal-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-dim);border:1px solid rgba(232,180,84,0.4);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;color:var(--text-dim);}
  .gcal-banner button{background:var(--gold);color:#1a1305;border:none;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .gcal-banner .link-btn{background:transparent;color:var(--text-faint);text-decoration:underline;padding:0;font-weight:500;}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const RANK_TIERS = [
    {min:1,max:2,name:'Recrue'},
    {min:3,max:5,name:'Sergent'},
    {min:6,max:9,name:'Officier'},
    {min:10,max:14,name:'Commandant'},
    {min:15,max:9999,name:'Général'},
  ];

  const state = {
    view:'habits',
    habits:[],
    completions:{},
    brain:{categories:[]},
    activeCategoryId:null,
    activeSubtabId:null,
    addingHabit:false,
    addingCategory:false,
    addingSubtab:false,
    editingId:null,
    confirmDelete:null,
    synced:false,
    events:[],
    planningDate: null, // set at init to today
    addingEvent:false,
  };
  const GRID_START_HOUR = 6;
  const GRID_END_HOUR = 23;
  const ROW_PX = 50;

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function formatDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }
  function todayKey(){ return formatDate(new Date()); }
  function minutesFromMidnight(t){ const [h,m] = t.split(':').map(Number); return h*60+(m||0); }
  function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return formatDate(d); }
  function getWeekDates(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const dow = (d.getDay()+6)%7; // 0=Mon .. 6=Sun
    const monday = new Date(d); monday.setDate(d.getDate()-dow);
    const out = [];
    for(let i=0;i<7;i++){ const x = new Date(monday); x.setDate(monday.getDate()+i); out.push(formatDate(x)); }
    return out;
  }
  const DOW_LABELS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const RECUR_LABELS = {daily:'Tous les jours', weekly:'Toutes les semaines', weekdays:'Jours de semaine', monthly:'Tous les mois'};
  function generateRecurrenceDates(startDate, freq, untilDate){
    const dates = [];
    let d = startDate;
    let guard = 0;
    while(d <= untilDate && guard < 366){
      guard++;
      if(freq==='daily'){ dates.push(d); d = addDays(d,1); }
      else if(freq==='weekly'){ dates.push(d); d = addDays(d,7); }
      else if(freq==='weekdays'){
        const dow = new Date(d+'T00:00:00').getDay();
        if(dow!==0 && dow!==6) dates.push(d);
        d = addDays(d,1);
      }
      else if(freq==='monthly'){
        dates.push(d);
        const dt = new Date(d+'T00:00:00');
        dt.setMonth(dt.getMonth()+1);
        d = formatDate(dt);
      }
      else { dates.push(d); break; }
    }
    return dates;
  }
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function withTimeout(promise, ms, fallbackVal){
    return Promise.race([
      Promise.resolve(promise),
      new Promise(resolve => setTimeout(()=> resolve(fallbackVal), ms))
    ]);
  }
  const TIMED_OUT = Symbol('timeout');
  const hasClaudeStorage = ()=> typeof window.storage !== 'undefined' && typeof window.storage.get === 'function';

  // --- Supabase (used only when running outside Claude, e.g. hosted on GitHub Pages) ---
  const SUPABASE_URL = 'https://xszgbiafadaveeafbgln.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzemdiaWFmYWRhdmVlYWZiZ2xuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NDk0MzQsImV4cCI6MjA5NzAyNTQzNH0.qCPoVelWTObSDf4j58-zC8TwddFTLHSlYRD5p7unaTo';
  let supabaseClient = null;
  if(!hasClaudeStorage() && window.supabase && SUPABASE_URL.startsWith('https://')){
    try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
    catch(e){ console.error('supabase init failed', e); }
  }

  function getSpaceCode(){
    let code = localStorage.getItem('qg-space-code');
    if(!code){
      code = prompt("Crée un code personnel pour synchroniser tes données entre appareils (note-le bien, tu devras ressaisir exactement le même sur ton autre appareil) :", '');
      if(!code || !code.trim()) code = 'qg-' + Math.random().toString(36).slice(2,10);
      localStorage.setItem('qg-space-code', code.trim());
    }
    return localStorage.getItem('qg-space-code');
  }
  const SPACE_CODE = (!hasClaudeStorage() && supabaseClient) ? getSpaceCode() : null;

  // --- Google Calendar two-way sync (only relevant when hosted outside Claude) ---
  const GOOGLE_CLIENT_ID = '477053643317-b5hegsuqmrguhu6nqn8frn2oskjpu7e3.apps.googleusercontent.com';
  const GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
  const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
  let googleAccessToken = null;
  let gTokenClient = null;
  const googleEnabled = !hasClaudeStorage() && GOOGLE_CLIENT_ID.includes('.apps.googleusercontent.com');

  function initGoogleClient(){
    if(!googleEnabled || !window.google || !window.google.accounts) return;
    gTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GCAL_SCOPE,
      callback: (resp)=>{
        if(resp && resp.access_token){
          googleAccessToken = resp.access_token;
          const expiresAt = Date.now() + ((resp.expires_in||3500)*1000);
          try{
            localStorage.setItem('qg-google-connected','1');
            localStorage.setItem('qg-google-token', JSON.stringify({token: resp.access_token, expiresAt}));
          }catch(e){}
          pullGoogleEvents();
          render();
        }
      }
    });
    // Reuse a still-valid saved token instead of forcing a reconnect on every reload.
    try{
      const saved = JSON.parse(localStorage.getItem('qg-google-token') || 'null');
      if(saved && saved.token && saved.expiresAt > Date.now() + 60000){
        googleAccessToken = saved.token;
        pullGoogleEvents();
      }
    }catch(e){}
    render();
  }

  function gcalHeaders(){ return { Authorization:'Bearer '+googleAccessToken, 'Content-Type':'application/json' }; }

  async function gcalCreate(ev){
    if(!googleAccessToken) return;
    try{
      const body = {
        summary: `${ev.emoji} ${ev.title}`,
        description: ev.description || '',
        start:{ dateTime:`${ev.date}T${ev.start}:00`, timeZone:TZ },
        end:{ dateTime:`${ev.date}T${ev.end}:00`, timeZone:TZ },
        extendedProperties:{ private:{ qgId: ev.id } }
      };
      const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', { method:'POST', headers:gcalHeaders(), body:JSON.stringify(body) });
      if(res.ok){ const data = await res.json(); ev.gcalId = data.id; saveKey('events-v1', state.events); }
    }catch(e){ console.error('gcal create failed', e); }
  }
  async function gcalUpdate(ev){
    if(!googleAccessToken || !ev.gcalId) return;
    try{
      const body = {
        summary: `${ev.emoji} ${ev.title}`,
        description: ev.description || '',
        start:{ dateTime:`${ev.date}T${ev.start}:00`, timeZone:TZ },
        end:{ dateTime:`${ev.date}T${ev.end}:00`, timeZone:TZ },
      };
      await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${ev.gcalId}`, { method:'PATCH', headers:gcalHeaders(), body:JSON.stringify(body) });
    }catch(e){ console.error('gcal update failed', e); }
  }
  async function gcalDelete(ev){
    if(!googleAccessToken || !ev.gcalId) return;
    try{ await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${ev.gcalId}`, { method:'DELETE', headers:gcalHeaders() }); }
    catch(e){ console.error('gcal delete failed', e); }
  }
  async function pullGoogleEvents(){
    if(!googleAccessToken) return;
    try{
      const timeMin = new Date(); timeMin.setDate(timeMin.getDate()-3);
      const timeMax = new Date(); timeMax.setDate(timeMax.getDate()+45);
      const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(timeMin.toISOString())}&timeMax=${encodeURIComponent(timeMax.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=250`;
      const res = await fetch(url, { headers:{ Authorization:'Bearer '+googleAccessToken } });
      if(!res.ok) return;
      const data = await res.json();
      const existingGcalIds = new Set(state.events.filter(e=>e.gcalId).map(e=>e.gcalId));
      let changed = false;
      (data.items||[]).forEach(item=>{
        if(!item.start || !item.start.dateTime || existingGcalIds.has(item.id)) return;
        const qgId = item.extendedProperties && item.extendedProperties.private && item.extendedProperties.private.qgId;
        const local = qgId ? state.events.find(e=>e.id===qgId) : null;
        if(local){ local.gcalId = item.id; changed = true; return; }
        const s = new Date(item.start.dateTime), e = new Date(item.end.dateTime);
        state.events.push({
          id:uid(), date:formatDate(s),
          start:String(s.getHours()).padStart(2,'0')+':'+String(s.getMinutes()).padStart(2,'0'),
          end:String(e.getHours()).padStart(2,'0')+':'+String(e.getMinutes()).padStart(2,'0'),
          title: item.summary || '(Sans titre)', emoji:'📅', remind:0, description: item.description || '', gcalId:item.id
        });
        changed = true;
      });
      if(changed){ saveKey('events-v1', state.events); render(); }
    }catch(e){ console.error('gcal pull failed', e); }
  }

  async function supaGetValue(nsKey){
    const { data, error } = await supabaseClient.from('kv_store').select('value').eq('key', nsKey).maybeSingle();
    if(error || !data) return TIMED_OUT;
    return data.value;
  }
  async function supaSetValue(nsKey, value){
    await supabaseClient.from('kv_store').upsert({ key: nsKey, value, updated_at: new Date().toISOString() });
  }

  async function loadKey(key, fallback, timeoutMs){
    let remoteVal;
    try{
      if(hasClaudeStorage()){
        const r = await withTimeout(window.storage.get(key, false), timeoutMs || 2500, TIMED_OUT);
        if(r !== TIMED_OUT && r) remoteVal = JSON.parse(r.value);
      } else if(supabaseClient){
        const nsKey = SPACE_CODE + '::' + key;
        const val = await withTimeout(supaGetValue(nsKey), timeoutMs || 4000, TIMED_OUT);
        if(val !== TIMED_OUT && val !== null && val !== undefined) remoteVal = val;
      }
    }catch(e){ /* fall through to local cache */ }

    if(remoteVal !== undefined){
      try{ localStorage.setItem(key, JSON.stringify(remoteVal)); }catch(e){}
      return remoteVal;
    }
    try{
      const raw = localStorage.getItem(key);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return fallback;
  }
  async function saveKey(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
    try{
      if(hasClaudeStorage()){
        await withTimeout(window.storage.set(key, JSON.stringify(value), false), 4000, null);
      } else if(supabaseClient){
        const nsKey = SPACE_CODE + '::' + key;
        await withTimeout(supaSetValue(nsKey, value), 6000, null);
      }
    }
    catch(e){ console.error('save failed', key, e); }
  }

  // ---- derived data ----
  function getStreak(habitId){
    let streak=0;
    let d = new Date();
    const tKey = formatDate(d);
    if(!(state.completions[tKey] && state.completions[tKey][habitId])){
      d.setDate(d.getDate()-1);
    }
    while(true){
      const k = formatDate(d);
      if(state.completions[k] && state.completions[k][habitId]){
        streak++;
        d.setDate(d.getDate()-1);
      } else break;
    }
    return streak;
  }
  function getOverallStreak(){
    if(state.habits.length===0) return 0;
    let streak=0;
    let d = new Date();
    const allDoneOn = (k)=> state.habits.every(h => state.completions[k] && state.completions[k][h.id]);
    let tKey = formatDate(d);
    if(!allDoneOn(tKey)) d.setDate(d.getDate()-1);
    while(true){
      const k = formatDate(d);
      if(allDoneOn(k)){ streak++; d.setDate(d.getDate()-1); } else break;
    }
    return streak;
  }
  function getTotalXP(){
    let xp=0;
    for(const day in state.completions){
      xp += Object.keys(state.completions[day]).filter(hid => state.completions[day][hid]).length * 10;
    }
    return xp;
  }
  function getRank(level){
    return RANK_TIERS.find(t => level>=t.min && level<=t.max).name;
  }

  function getCoachMessage(){
    const tKey = todayKey();
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();

    if(state.habits.length===0){
      return {icon:'🧭', text:"Ajoute ta première habitude pour que je puisse commencer à te suivre."};
    }

    // 1. Événement du jour dans les 2h
    const todaysEvents = state.events
      .filter(e=>e.date===tKey)
      .map(e=>({...e, mins:minutesFromMidnight(e.start)}))
      .filter(e=> e.mins>=nowMin && e.mins-nowMin<=120)
      .sort((a,b)=>a.mins-b.mins);
    if(todaysEvents[0]){
      const diff = todaysEvents[0].mins - nowMin;
      const when = diff<=15 ? "dans quelques minutes" : `dans ~${Math.round(diff/15)*15} min`;
      return {icon:'⏰', text:`${todaysEvents[0].emoji} ${todaysEvents[0].title} ${when} (${todaysEvents[0].start}).`};
    }

    const doneToday = state.completions[tKey] || {};
    const notDone = state.habits.filter(h=>!doneToday[h.id]);

    // 2. Streak en danger
    if(notDone.length>0){
      let best = null;
      notDone.forEach(h=>{
        const s = getStreak(h.id);
        if(s>0 && (!best || s>best.s)) best = {h, s};
      });
      if(best && nowMin >= 19*60){
        return {icon:'🚨', text:`Ton streak "${best.h.name}" (${best.s}j) casse ce soir si tu ne le fais pas maintenant !`};
      }
      if(best){
        return {icon:'🔥', text:`Garde ton streak "${best.h.name}" (${best.s}j) vivant — tu as encore le temps aujourd'hui.`};
      }
      if(nowMin < 12*60){
        return {icon:'☀️', text:`Encore rien de coché ce matin. Commence par une habitude facile pour lancer la machine.`};
      }
      return {icon:'🎯', text:`Il te reste ${notDone.length} quête${notDone.length>1?'s':''} aujourd'hui : ${notDone.map(h=>h.name).join(', ')}.`};
    }

    // 3. Tout est fait
    const xp = getTotalXP();
    const level = Math.floor(xp/100)+1;
    const xpInLevel = xp % 100;
    if(xpInLevel >= 80){
      return {icon:'⭐', text:`Toutes tes quêtes sont bouclées ! Plus que ${100-xpInLevel} XP avant le niveau ${level+1}.`};
    }
    return {icon:'🎖️', text:'Toutes tes quêtes du jour sont bouclées. Bravo, soldat.'};
  }

  function addEvent(date, start, end, title, emoji, remind, description, recurrence, recurUntil){
    if(!title.trim() || !start) return;
    if(!end || minutesFromMidnight(end) <= minutesFromMidnight(start)){
      const em = minutesFromMidnight(start)+30;
      end = String(Math.floor(em/60)%24).padStart(2,'0')+':'+String(em%60).padStart(2,'0');
    }
    const useRecur = recurrence && recurrence!=='none' && recurUntil;
    const groupId = useRecur ? uid() : null;
    const dates = useRecur ? generateRecurrenceDates(date, recurrence, recurUntil) : [date];
    const newEvents = dates.map(d => ({
      id:uid(), date:d, start, end, title:title.trim(), emoji: emoji.trim() || '📌',
      remind: parseInt(remind,10)||0, description:(description||'').trim(),
      recurrenceGroupId: groupId, recurrenceLabel: groupId ? RECUR_LABELS[recurrence] : null
    }));
    state.events.push(...newEvents);
    saveKey('events-v1', state.events);
    state.addingEvent = false;
    render();
    if(googleAccessToken) pushEventsToGoogleSequential(newEvents);
  }
  function updateEvent(id, start, end, title, emoji, remind, description){
    const ev = state.events.find(e=>e.id===id);
    if(!ev) return;
    if(!title.trim() || !start) return;
    if(!end || minutesFromMidnight(end) <= minutesFromMidnight(start)){
      const em = minutesFromMidnight(start)+30;
      end = String(Math.floor(em/60)%24).padStart(2,'0')+':'+String(em%60).padStart(2,'0');
    }
    ev.start = start; ev.end = end; ev.title = title.trim(); ev.emoji = emoji.trim() || '📌';
    ev.remind = parseInt(remind,10)||0; ev.description = (description||'').trim();
    saveKey('events-v1', state.events);
    state.editingId = null;
    render();
    if(googleAccessToken){ if(ev.gcalId) gcalUpdate(ev); else gcalCreate(ev); }
  }
  function deleteEvent(id, wholeSeries){
    const ev = state.events.find(e=>e.id===id);
    if(!ev) return;
    let toDelete = [ev];
    if(wholeSeries && ev.recurrenceGroupId){
      toDelete = state.events.filter(e=>e.recurrenceGroupId===ev.recurrenceGroupId);
    }
    const idSet = new Set(toDelete.map(e=>e.id));
    state.events = state.events.filter(e=>!idSet.has(e.id));
    saveKey('events-v1', state.events);
    state.confirmDelete = null;
    state.editingId = null;
    render();
    if(googleAccessToken){
      toDelete.forEach(e=>{ if(e.gcalId) gcalDelete(e); });
    }

            <input class="name-in" name="name" placeholder="Nom du sous-onglet" autofocus style="width:160px;">
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" data-action="cancel-add-subtab">Annuler</button>
            <button type="submit" class="btn btn-primary">Créer</button>
          </div>
        </form>`;
      } else {
        subAddBlock = `<div class="pill-add" data-action="start-add-subtab">+</div>`;
      }

      subtabsHTML = `<div class="pill-row">${subPills}${subAddBlock}</div>`;

      const activeSub = activeCat.subtabs.find(s=>s.id===state.activeSubtabId);
      if(activeSub){
        noteHTML = `<div class="note-wrap">
          <div class="note-head">
            <span class="note-title">${esc(activeCat.name)} / ${esc(activeSub.name)}</span>
            <span class="save-indicator" id="save-indicator">Enregistré ✓</span>
          </div>
          <textarea class="note-textarea" data-cat-id="${activeCat.id}" data-sub-id="${activeSub.id}" placeholder="Écris tes notes ici…">${esc(activeSub.content)}</textarea>
        </div>`;
      } else {
        noteHTML = `<div class="brain-empty">Aucun sous-onglet. Crée-en un pour commencer à écrire.</div>`;
      }
    }

    return `
      <div class="section-label">Deuxième cerveau</div>
      <div class="pill-row">${catPills}${catAddBlock}<div class="pill-add" data-action="start-add-category" ${state.addingCategory?'style="display:none"':''}>+</div></div>
      ${activeCat ? subtabsHTML + noteHTML : ''}
    `;
  }

  function renderPlanning(){
    const dateStr = state.planningDate;
    const week = getWeekDates(dateStr);
    const isTodaySelected = dateStr === todayKey();

    const weekStrip = week.map((d, i)=>{
      const dNum = parseInt(d.slice(8,10),10);
      const active = d === dateStr;
      const isToday = d === todayKey();
      return `<div class="day-pill ${active?'active':''} ${isToday?'is-today':''}" data-action="select-day" data-id="${d}">
        <div class="dow">${DOW_LABELS[i]}</div>
        <div class="dnum">${dNum}</div>
      </div>`;
    }).join('');

    let formHTML = '';
    const editingEvent = state.editingId && state.editingId.startsWith('event:')
      ? state.events.find(e=>e.id===state.editingId.slice(6)) : null;

    if(editingEvent){
      const confirming = state.confirmDelete === 'event:'+editingEvent.id;
      const isSeries = !!editingEvent.recurrenceGroupId;
      formHTML = `<form class="event-form" data-form="edit-event" data-id="${editingEvent.id}">
        <div class="row">
          <input class="emoji-in2" name="emoji" value="${esc(editingEvent.emoji)}" maxlength="4">
          <input class="title-in" name="title" value="${esc(editingEvent.title)}" placeholder="Titre">
        </div>
        <div class="row">
          <input class="time-in" type="time" name="start" value="${editingEvent.start}">
          <input class="time-in" type="time" name="end" value="${editingEvent.end}">
        </div>
        ${isSeries ? `<div class="row"><span style="font-size:11px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;">🔁 ${esc(editingEvent.recurrenceLabel||'')}</span></div>` : ''}
        <div class="row">
          <textarea name="description" class="desc-textarea" placeholder="Description (optionnel)">${esc(editingEvent.description||'')}</textarea>
        </div>
        <div class="row">
          <select name="remind" class="remind-select">
            <option value="0" ${!editingEvent.remind?'selected':''}>Pas de rappel</option>
            <option value="15" ${editingEvent.remind===15?'selected':''}>15 min avant</option>
            <option value="30" ${editingEvent.remind===30?'selected':''}>30 min avant</option>
            <option value="60" ${editingEvent.remind===60?'selected':''}>1h avant</option>
            <option value="120" ${editingEvent.remind===120?'selected':''}>2h avant</option>
            <option value="1440" ${editingEvent.remind===1440?'selected':''}>1 jour avant</option>
          </select>
        </div>
        <div class="form-actions" style="flex-wrap:wrap;">
          <button type="button" class="btn ${confirming?'':'btn-ghost'}" style="${confirming?'background:var(--danger);color:#2a0f0b;':''}" data-action="delete-event" data-id="${editingEvent.id}">${confirming?'Confirmer':'🗑 Cet évènement'}</button>
          ${isSeries ? `<button type="button" class="btn btn-ghost" style="color:var(--danger);" data-action="delete-event-series" data-id="${editingEvent.id}">🗑 Toute la série</button>` : ''}
          <button type="button" class="btn btn-ghost" data-action="cancel-edit-event">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>`;
    } else if(state.addingEvent){
      formHTML = `<form class="event-form" data-form="add-event">
        <div class="row">
          <input class="emoji-in2" name="emoji" placeholder="📌" maxlength="4">
          <input class="title-in" name="title" placeholder="Titre de l'évènement" autofocus>
        </div>
        <div class="row">
          <input class="time-in" type="time" name="start" value="09:00">
          <input class="time-in" type="time" name="end" value="10:00">
        </div>
        <div class="row">
          <textarea name="description" class="desc-textarea" placeholder="Description (optionnel)"></textarea>
        </div>
        <div class="row">
          <select name="remind" class="remind-select">
            <option value="0">Pas de rappel</option>
            <option value="15">15 min avant</option>
            <option value="30">30 min avant</option>
            <option value="60" selected>1h avant</option>
            <option value="120">2h avant</option>
            <option value="1440">1 jour avant</option>
          </select>
        </div>
        <div class="row">
          <select name="recurrence" class="remind-select" data-action-onchange="toggle-recur-until">
            <option value="none">Ne se répète pas</option>
            <option value="daily">Tous les jours</option>
            <option value="weekdays">Jours de semaine (Lun-Ven)</option>
            <option value="weekly">Toutes les semaines</option>
            <option value="monthly">Tous les mois</option>
          </select>
        </div>
        <div class="row">
          <input class="time-in" type="date" name="recurUntil" style="width:100%;" value="${addDays(state.planningDate,60)}">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-action="cancel-add-event">Annuler</button>
          <button type="submit" class="btn btn-primary">Ajouter</button>
        </div>
      </form>`;
    }

    const addBar = (!state.addingEvent && !editingEvent)
      ? `<div class="add-event-bar" data-action="start-add-event">+ Ajouter un évènement</div>` : '';

    const gridHeight = (GRID_END_HOUR - GRID_START_HOUR) * ROW_PX + 30;
    let hourLabels = '';
    for(let h=GRID_START_HOUR; h<=GRID_END_HOUR; h++){
      const top = (h - GRID_START_HOUR) * ROW_PX;
      hourLabels += `<div class="hour-label" style="top:${top}px">${String(h).padStart(2,'0')}:00</div>`;
    }

    const dayEvents = state.events.filter(e=>e.date===dateStr).sort((a,b)=> minutesFromMidnight(a.start)-minutesFromMidnight(b.start));
    let eventBlocks = dayEvents.map(ev=>{
      const top = (minutesFromMidnight(ev.start) - GRID_START_HOUR*60) * (ROW_PX/60);
      const height = Math.max(24, (minutesFromMidnight(ev.end) - minutesFromMidnight(ev.start)) * (ROW_PX/60));
      return `<div class="event-block" style="top:${top}px;height:${height}px" data-action="edit-event" data-id="${ev.id}">
        <div class="event-title">${ev.emoji} ${esc(ev.title)}${ev.recurrenceGroupId?' 🔁':''}</div>
        <div class="event-time">${ev.start} – ${ev.end}</div>
      </div>`;
    }).join('');

    let nowLine = '';
    if(isTodaySelected){
      const now = new Date();
      const nowMin = now.getHours()*60+now.getMinutes();
      if(nowMin >= GRID_START_HOUR*60 && nowMin <= GRID_END_HOUR*60){
        const top = (nowMin - GRID_START_HOUR*60) * (ROW_PX/60);
        nowLine = `<div class="now-line" style="top:${top}px"></div>`;
      }
    }

    return `
      <div class="section-label">Planning</div>
      ${renderNotifBanner()}
      ${renderGcalBanner()}
      <div class="week-nav">
        <button class="arrow" data-action="shift-week" data-dir="-7">‹</button>
        <button class="today-btn" data-action="go-today">Aujourd'hui</button>
        <button class="arrow" data-action="shift-week" data-dir="7">›</button>
      </div>
      <div class="week-strip">${weekStrip}</div>
      <div class="agenda-wrap">
        ${addBar}
        ${formHTML}
        <div class="agenda-scroll">
          <div class="agenda-grid" style="height:${gridHeight}px">
            ${hourLabels}
            ${eventBlocks}
            ${nowLine}
          </div>
        </div>
      </div>
    `;
  }

  function renderGcalBanner(){
    if(!googleEnabled) return '';
    if(googleAccessToken){
      return `<div class="gcal-banner">📅 Google Agenda connecté — synchro à jour. <span class="link-btn" data-action="disconnect-google" style="cursor:pointer;">Déconnecter</span></div>`;
    }
    return `<div class="gcal-banner"><span>Relie ton Google Agenda pour une synchro dans les deux sens.</span><button data-action="connect-google">Connecter</button></div>`;
  }

  function renderNotifBanner(){
    if(typeof Notification === 'undefined') return '';
    if(Notification.permission === 'granted'){
      return `<div class="notif-banner">🔔 Rappels activés — tant que le site est ouvert dans un onglet.</div>`;
    }
    if(Notification.permission === 'denied'){
      return `<div class="notif-banner">🔕 Notifications bloquées par le navigateur. Autorise-les dans les réglages du site pour recevoir les rappels.</div>`;
    }
    return `<div class="notif-banner"><span>Active les notifications pour recevoir tes rappels d'évènements.</span><button data-action="enable-notifs">Activer</button></div>`;
  }

  function checkReminders(){
    if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const todayStr = todayKey();
    let notified = [];
    try{ notified = JSON.parse(localStorage.getItem('qg-notified') || '[]'); }catch(e){}
    let changed = false;
    state.events.forEach(ev=>{
      if(!ev.remind || ev.remind<=0) return;
      const evMin = minutesFromMidnight(ev.start);
      const triggerMin = evMin - ev.remind;
      const notifKey = ev.id+':'+ev.date;
      const isRelevantDay = ev.date === todayStr || (ev.remind>=1440 && ev.date === addDays(todayStr,1));
      if(!isRelevantDay) return;
      const effectiveNowMin = ev.date===todayStr ? nowMin : nowMin - 1440;
      if(effectiveNowMin >= triggerMin && effectiveNowMin <= evMin && !notified.includes(notifKey)){
        try{ new Notification(`${ev.emoji} ${ev.title}`, { body: `Prévu à ${ev.start} (dans ~${ev.remind} min)` }); }catch(e){}
        notified.push(notifKey);
        changed = true;
      }
    });
    if(changed){
      try{ localStorage.setItem('qg-notified', JSON.stringify(notified.slice(-300))); }catch(e){}
    }
  }

  function render(){
    const today = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
    document.getElementById('app').innerHTML = `
      <div class="header">
        <div class="brand">Q<span>G</span></div>
        <div class="date">${today}</div>
      </div>
      <div class="nav-switch">
        <button class="tab-habits ${state.view==='habits'?'active':''}" data-action="switch-view" data-view="habits">🎯 Habitudes</button>
        <button class="tab-brain ${state.view==='brain'?'active':''}" data-action="switch-view" data-view="brain">🧠 Cerveau</button>
        <button class="tab-planning ${state.view==='planning'?'active':''}" data-action="switch-view" data-view="planning">📅 Planning</button>
      </div>
      ${state.view==='habits' ? renderHabits() : state.view==='brain' ? renderBrain() : renderPlanning()}
      ${!state.synced ? '<div class="sync-note">Synchronisation en cours…</div>' : ''}
      ${supabaseClient ? `<div class="sync-note">☁️ Cloud actif — code : <b style="color:var(--text-dim)">${esc(SPACE_CODE)}</b> <span data-action="change-code" style="text-decoration:underline;cursor:pointer;">(changer)</span></div>` : ''}
    `;
    const focusEl = document.querySelector('.rename-in, .inline-form input');
    if(focusEl){ focusEl.focus(); if(focusEl.value) focusEl.setSelectionRange(focusEl.value.length, focusEl.value.length); }
  }

  // ---- event delegation ----
  document.addEventListener('click', (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    switch(action){
      case 'switch-view':
        state.view = el.dataset.view;
        state.confirmDelete = null; state.editingId = null;
        render();
        break;
      case 'toggle-habit':
        toggleHabit(id); break;
      case 'start-add-habit':
        state.addingHabit = true; render(); break;
      case 'cancel-add-habit':
        state.addingHabit = false; render(); break;
      case 'edit-habit':
        state.editingId = 'habit:'+id; state.confirmDelete=null; render(); break;
      case 'delete-habit':
        if(state.confirmDelete === 'habit:'+id) deleteHabit(id);
        else { state.confirmDelete = 'habit:'+id; render(); }
        break;

      case 'start-add-category':
        state.addingCategory = true; render(); break;
      case 'cancel-add-category':
        state.addingCategory = false; render(); break;
      case 'select-category':
        state.activeCategoryId = id; state.activeSubtabId = null; state.confirmDelete=null; render(); break;
      case 'edit-category':
        state.editingId = 'cat:'+id; state.confirmDelete=null; render(); break;
      case 'delete-category':
        if(state.confirmDelete === 'cat:'+id) deleteCategory(id);
        else { state.confirmDelete = 'cat:'+id; render(); }
        break;

      case 'start-add-subtab':
        state.addingSubtab = true; render(); break;
      case 'cancel-add-subtab':
        state.addingSubtab = false; render(); break;
      case 'select-subtab':
        state.activeSubtabId = id; state.confirmDelete=null; render(); break;
      case 'edit-subtab':
        state.editingId = 'sub:'+id; state.confirmDelete=null; render(); break;
      case 'delete-subtab':
        if(state.confirmDelete === 'sub:'+id) deleteSubtab(el.dataset.parent, id);
        else { state.confirmDelete = 'sub:'+id; render(); }
        break;

      case 'shift-week':
        state.planningDate = addDays(state.planningDate, parseInt(el.dataset.dir,10));
        render();
        break;
      case 'go-today':
        state.planningDate = todayKey();
        render();
        break;
      case 'select-day':
        state.planningDate = id;
        render();
        break;
      case 'start-add-event':
        state.addingEvent = true; state.editingId = null; render(); break;
      case 'cancel-add-event':
        state.addingEvent = false; render(); break;
      case 'edit-event':
        state.editingId = 'event:'+id; state.addingEvent = false; state.confirmDelete = null; render(); break;
      case 'cancel-edit-event':
        state.editingId = null; state.confirmDelete = null; render(); break;
      case 'delete-event':
        if(state.confirmDelete === 'event:'+id) deleteEvent(id, false);
        else { state.confirmDelete = 'event:'+id; render(); }
        break;
      case 'delete-event-series':
        if(confirm("Supprimer TOUTE la série (tous les jours générés par cette récurrence) ? Cette action est irréversible.")){
          deleteEvent(id, true);
        }
        break;
      case 'change-code':
        if(confirm("Changer de code va recharger la page et te redemander un nouveau code. Continuer ?")){
          localStorage.removeItem('qg-space-code');
          location.reload();
        }
        break;
      case 'enable-notifs':
        if(typeof Notification !== 'undefined'){
          Notification.requestPermission().then(()=> render());
        }
        break;
      case 'connect-google':
        if(gTokenClient) gTokenClient.requestAccessToken({prompt:'consent'});
        else alert("Le module Google n'est pas encore chargé, réessaie dans une seconde.");
        break;
      case 'disconnect-google':
        googleAccessToken = null;
        try{ localStorage.removeItem('qg-google-connected'); localStorage.removeItem('qg-google-token'); }catch(e){}
        render();
        break;
    }
  });

  document.addEventListener('submit', (e)=>{
    const form = e.target.closest('form[data-form]');
    if(!form) return;
    e.preventDefault();
    const type = form.dataset.form;
    if(type==='add-habit'){
      addHabit(form.name.value, form.emoji.value);
    } else if(type==='add-category'){
      addCategory(form.name.value, form.emoji.value);
    } else if(type==='add-subtab'){
      addSubtab(form.dataset.parent, form.name.value);
    } else if(type==='add-event'){
      addEvent(state.planningDate, form.start.value, form.end.value, form.title.value, form.emoji.value, form.remind.value, form.description.value, form.recurrence.value, form.recurUntil.value);
    } else if(type==='edit-event'){
      updateEvent(form.dataset.id, form.start.value, form.end.value, form.title.value, form.emoji.value, form.remind.value, form.description.value);
    }
  });

  document.addEventListener('blur', (e)=>{
    if(e.target.matches && e.target.matches('.rename-in')){
      const type = e.target.dataset.renameType;
      const id = e.target.dataset.renameId;
      const val = e.target.value;
      if(type==='habit') renameHabit(id, val);
      else if(type==='category') renameCategory(id, val);
      else if(type==='subtab') renameSubtab(e.target.dataset.renameParent, id, val);
      state.editingId = null;
      render();
    }
  }, true);

  document.addEventListener('keydown', (e)=>{
    if(e.target.matches && e.target.matches('.rename-in') && e.key==='Enter'){
      e.preventDefault();
      e.target.blur();
    }
  });

  document.addEventListener('input', (e)=>{
    if(e.target.matches && e.target.matches('.note-textarea')){
      updateSubtabContent(e.target.dataset.catId, e.target.dataset.subId, e.target.value);
    }
  });

  // ---- init ----
  // 1. Show the app immediately with sensible defaults so nothing ever blocks on loading.
  state.habits = defaultHabits();
  state.brain = defaultBrain();
  state.activeCategoryId = state.brain.categories[0].id;
  state.planningDate = todayKey();
  render();

  // 2. Try to sync with saved data in the background (times out gracefully if storage is slow/unavailable).
  (async function sync(){
    try{
      const [habits, completions, brain, events] = await Promise.all([
        loadKey('habits-v1', null),
        loadKey('completions-v1', {}),
        loadKey('brain-v1', null),
        loadKey('events-v1', []),
      ]);
      if(habits) state.habits = habits;
      if(completions) state.completions = completions;
      if(brain) state.brain = brain;
      if(events) state.events = events;
      if(state.brain.categories[0] && !state.brain.categories.find(c=>c.id===state.activeCategoryId)){
        state.activeCategoryId = state.brain.categories[0].id;
      }
      if(!habits) saveKey('habits-v1', state.habits);
      if(!brain) saveKey('brain-v1', state.brain);
    } catch(e){
      console.error('sync error', e);
    } finally {
      state.synced = true;
      render();
    }
  })();

  // 3. Keep the "now" line fresh and check event reminders.
  checkReminders();
  setInterval(()=>{
    checkReminders();
    if(state.view==='planning') render();
  }, 30000);
})();
</script>
</body>
</html>
